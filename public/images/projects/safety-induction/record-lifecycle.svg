<rect x="297" y="838" width="155" height="26" rx="13" fill="#efeee9"/><text x="374.5" y="856" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#454a54" text-anchor="middle">Identifiers masked</text>
<rect x="464" y="838" width="155" height="26" rx="13" fill="#efeee9"/><text x="541.5" y="856" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#454a54" text-anchor="middle">Example dates only</text>
<text x="50" y="948" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#757b87" text-anchor="start">Illustrative example — anonymized. Not real company data; field names are simplified.</text>
