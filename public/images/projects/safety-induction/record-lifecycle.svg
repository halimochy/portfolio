<text x="1138" y="672" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#454a54" text-anchor="start">13 Jan</text>
<text x="1445.2" y="672" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#454a54" text-anchor="middle">13 Jun</text>
<text x="1491.28" y="696" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#454a54" text-anchor="middle">13 Jul</text>
